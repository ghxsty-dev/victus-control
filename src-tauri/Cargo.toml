[package]
name = "victus-control"
version = "0.1.0"
description = "HP Victus için sıcaklık tabanlı fan eğrisi + CPU/GPU güç limiti kontrolü (Tauri + Rust)"
authors = ["victus-control"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
